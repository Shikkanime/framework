[versions]
kotlin = "2.4.10"
exposed = "1.3.1"
hikariCP = "7.1.0"
liquibase = "5.0.3"
h2 = "2.4.240"
ktor = "3.5.1"
swaggerCodeGenerators = "1.0.62"
junitJupiter = "6.1.1"
mockk = "1.14.11"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
exposedCore = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposedDao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposedJdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposedKotlinDateTime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
hikariCP = { module = "com.zaxxer:HikariCP", version.ref = "hikariCP" }
liquibaseCore = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
kotlinReflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
ktorServerCore = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktorServerCio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktorServerContentNegociation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktorSerializationJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktorSerializationProtobuf = { module = "io.ktor:ktor-serialization-kotlinx-protobuf", version.ref = "ktor" }
ktorServerSwagger = { module = "io.ktor:ktor-server-swagger", version.ref = "ktor" }
swaggerCodeGenerators = { module = "io.swagger.codegen.v3:swagger-codegen-generators", version.ref = "swaggerCodeGenerators" }
ktorServerCors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
junitJupiterApi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitJupiter" }
junitJupiterEngine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitJupiter" }
junitJupiterParams = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junitJupiter" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# Libraries can be bundled together for easier import
[bundles]
exposedEcosystem = ["exposedCore", "exposedDao", "exposedJdbc", "exposedKotlinDateTime", "hikariCP", "liquibaseCore"]
ktorServerEcosystem = ["ktorServerCore", "ktorServerCio", "ktorServerContentNegociation", "ktorSerializationJson", "ktorSerializationProtobuf", "ktorServerSwagger", "swaggerCodeGenerators", "ktorServerCors"]
testEcosystem = ["junitJupiterApi", "junitJupiterEngine", "junitJupiterParams", "mockk"]

[plugins]
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }