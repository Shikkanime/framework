version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Europe/Paris"
    assignees:
      - "Ziedelth"
    groups:
      ktor:
        patterns:
          - "*ktor*"
      exposed:
        patterns:
          - "*exposed*"
      koin:
        patterns:
          - "*koin*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Europe/Paris"
    assignees:
      - "Ziedelth"
